# 임시 진단용: GitHub Pages 출처(https://rlasksk030.github.io)의 브라우저가 오늘근무 공유 링크를 읽을 수 있는지(CORS) 확인한다.
# 개인 데이터 보호: 실제 사용자 공유 링크는 쓰지 않고, 응답 본문은 출력하지 않는다(헤더·크기·구조 지표만).
name: Probe todayshift CORS
on:
  push:
    branches: [probe/todayshift-cors]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP 헤더 확인 (본문 미출력)
        run: |
          for url in "https://todayshift.com/share/1" "https://todayshift.com/share/999999999" "https://todayshift.com/"; do
            echo "=== $url"
            curl -sS -L -o body.bin -D headers.txt -w "status=%{http_code} final=%{url_effective} bytes=%{size_download}\n" \
              -H "Origin: https://rlasksk030.github.io" "$url" || echo "curl 실패"
            grep -i -E "^(HTTP/|content-type|access-control-|vary|server|location|x-frame|content-security)" headers.txt || true
            echo "script 태그 수: $(grep -o -i '<script' body.bin | wc -l)"
            echo "__NEXT_DATA__ 포함: $(grep -c '__NEXT_DATA__' body.bin || true)"
            echo "--- 사전 요청(OPTIONS)"
            curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: https://rlasksk030.github.io" -H "Access-Control-Request-Method: GET" "$url" | grep -i -E "^(HTTP/|access-control-)" || true
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 실제 브라우저에서 GitHub Pages 출처로 fetch 시도
        run: |
          npm init -y >/dev/null
          npm i -D @playwright/test@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > probe.mjs <<'JS'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch();
          const page = await browser.newPage();
          // GitHub Pages 출처의 빈 페이지 (앱의 CSP 없이 순수 CORS만 확인)
          await page.route("https://rlasksk030.github.io/probe", (r) => r.fulfill({ contentType: "text/html", body: "<!doctype html><title>probe</title>" }));
          await page.goto("https://rlasksk030.github.io/probe");
          for (const url of ["https://todayshift.com/share/1", "https://todayshift.com/share/999999999"]) {
            const result = await page.evaluate(async (u) => {
              try {
                const res = await fetch(u, { mode: "cors", credentials: "omit" });
                const text = await res.text();
                return { ok: true, status: res.status, type: res.type, bytes: text.length };
              } catch (e) {
                return { ok: false, error: String(e) };
              }
            }, url);
            console.log("fetch", url, JSON.stringify(result));
          }
          // 공유 페이지가 내부적으로 호출하는 API의 호스트·경로와 CORS 헤더만 기록 (본문 미출력)
          const share = await browser.newPage();
          share.on("response", async (r) => {
            const t = r.request().resourceType();
            if (t === "xhr" || t === "fetch" || t === "document") {
              const h = r.headers();
              console.log("share-page", t, r.status(), new URL(r.url()).host + new URL(r.url()).pathname.replace(/\d{3,}/g, "<id>"), "ACAO=" + (h["access-control-allow-origin"] ?? "(없음)"));
            }
          });
          await share.goto("https://todayshift.com/share/1", { waitUntil: "networkidle" }).catch((e) => console.log("goto 실패", String(e)));
          console.log("share-page title:", await share.title().catch(() => "?"));
          await browser.close();
          JS
          node probe.mjs
